spring:
  application:
    name: space-pioneers
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacepioneers}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # zbudowany frontend: wbudowany w jar (classpath:/static) albo wskazany katalog FRONTEND_DIR
      static-locations: classpath:/static/,file:${FRONTEND_DIR:../frontend/dist}/

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

spacepioneers:
  accounts:
    # usuwanie kont nieaktywnych dluzej niz tyle dni (0 = wylaczone); nie dotyczy adminow i urlopu
    inactive-delete-days: ${INACTIVE_DELETE_DAYS:0}
  # limity zapytan API (na sesje lub adres IP); za serwerem proxy ustaw SERVER_FORWARD_HEADERS_STRATEGY=native
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:600}
    api-burst: ${RATE_LIMIT_API_BURST:120}
  # adres gry uzywany w linkach z e-maili
  public-url: ${PUBLIC_URL:http://localhost:8080}
  mail:
    # Serwer SMTP wlacza sie zmiennymi SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
    # (oraz np. SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true). Bez nich wiadomosci trafiaja do dziennika.
    from: ${MAIL_FROM:no-reply@spacepioneers.local}
    # tylko srodowiska testowe: ostatnie e-maile pod /api/dev/outbox
    dev-outbox: ${MAIL_DEV_OUTBOX:false}
  universe:
    name: ${UNIVERSE_NAME:Galaktyka 1}
    galaxies: ${UNIVERSE_GALAXIES:5}
    systems: ${UNIVERSE_SYSTEMS:200}
    positions: 15
    speed: ${UNIVERSE_SPEED:1.0}
    newbie-protection-points: ${UNIVERSE_NEWBIE_POINTS:5000}
  scheduler:
    enabled: true
    tick-ms: 1000
    ranking-ms: ${RANKING_INTERVAL_MS:300000}
