services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: spacepioneers
      POSTGRES_USER: spacepioneers
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zmien-mnie}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacepioneers"]
      interval: 5s
      retries: 10

  game:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/spacepioneers
      DB_USER: spacepioneers
      DB_PASSWORD: ${DB_PASSWORD:-zmien-mnie}
      UNIVERSE_NAME: ${UNIVERSE_NAME:-Uniwersum 1}
      UNIVERSE_SPEED: ${UNIVERSE_SPEED:-1}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      MAIL_FROM: ${MAIL_FROM:-no-reply@spacepioneers.local}
      # dane administratora w regulaminie i polityce prywatnosci (/regulamin, /prywatnosc)
      LEGAL_OPERATOR: ${LEGAL_OPERATOR:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      # odkomentuj, aby wysylac poczte przez SMTP:
      # SPRING_MAIL_HOST: smtp.example.com
      # SPRING_MAIL_PORT: 587
      # SPRING_MAIL_USERNAME: uzytkownik
      # SPRING_MAIL_PASSWORD: haslo
      # SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      # SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    ports:
      - "8080:8080"

  # Codzienna kopia bazy (o BACKUP_HOUR, czas polski) + wysylka poza serwer przez rclone.
  # Kopie lokalne: ./backups, konfiguracja chmury: ./backup-config/rclone.conf (docs/BACKUP.md).
  backup:
    build: ./deploy/backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: spacepioneers
      PGPASSWORD: ${DB_PASSWORD:-zmien-mnie}
      PGDATABASE: spacepioneers
      TZ: Europe/Warsaw
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_REMOTE_DAYS: ${BACKUP_REMOTE_DAYS:-30}
      RCLONE_CONFIG: /config/rclone.conf
    volumes:
      - ./backups:/backups
      - ./backup-config:/config
    restart: unless-stopped

volumes:
  db-data:
