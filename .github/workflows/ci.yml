name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spacepioneers_test
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/spacepioneers_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t space-pioneers:ci .
      - run: docker build -t space-pioneers-backup:ci deploy/backup

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spacepioneers
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/spacepioneers
      DB_USER: postgres
      DB_PASSWORD: postgres
      E2E_PSQL: psql postgresql://postgres:postgres@localhost:5432/spacepioneers
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: mvn -B -q package -DskipTests
        working-directory: backend
      - name: Start game server (fast universe)
        run: |
          FRONTEND_DIR=$PWD/frontend/dist MAIL_DEV_OUTBOX=true UNIVERSE_SPEED=2000 UNIVERSE_GALAXIES=1 UNIVERSE_SYSTEMS=3 \
            UNIVERSE_NEWBIE_POINTS=0 UNIVERSE_START_RESOURCES=1000000 RANKING_INTERVAL_MS=5000 nohup java -jar backend/target/space-pioneers-backend-*.jar > server.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/api/stats && break; sleep 1; done
      - run: |
          for t in gameplay advanced account social tools board; do node e2e/$t.e2e.mjs; done
        working-directory: frontend
      - if: failure()
        run: tail -200 server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: frontend/e2e-shots

  # Auto-deploy: po zielonym CI na mainie GitHub laczy sie z serwerem przez SSH i uruchamia deploy/deploy.sh.
  # Wylaczony, dopoki w repozytorium nie ma sekretu DEPLOY_SSH_KEY (docs/DEPLOY.md).
  deploy:
    needs: [backend, frontend, docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Sprawdz konfiguracje
        id: cfg
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice title=Auto-deploy::Wylaczony - brak sekretu DEPLOY_SSH_KEY (docs/DEPLOY.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Aktualizacja gry na serwerze
        if: steps.cfg.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ secrets.DEPLOY_PATH }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # klucz wklejony z Windowsa ma \r na koncu linii - SSH uznaje go wtedy za nieczytelny
          # klucz moze byc wklejony jako jedna linia base64 (zalecane: base64 -w0 ~/.ssh/github_deploy) albo jako plik
          # z liniami BEGIN/END; w drugim przypadku odtwarzamy podzial linii, gdyby schowek go zgubil
          k="$(printf '%s' "$KEY" | tr -d '\r')"
          if printf '%s' "$k" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            body="$(printf '%s' "$k" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \n\t')"
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s' "$body" | fold -w 70; echo; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/deploy
          else
            printf '%s' "$k" | tr -d ' \n\t' | base64 -d > ~/.ssh/deploy 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy > ~/.ssh/deploy.pub 2>/dev/null; then
            echo "::error title=Auto-deploy::DEPLOY_SSH_KEY nie jest poprawnym kluczem prywatnym - wklej wynik: base64 -w0 ~/.ssh/github_deploy (jedna linia)"
            exit 1
          fi
          # odcisk do porownania z: ssh-keygen -lf ~/.ssh/github_deploy.pub (na serwerze)
          echo "::notice title=Auto-deploy::Klucz z sekretu: $(ssh-keygen -lf ~/.ssh/deploy.pub)"
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${DEPLOY_USER:-ubuntu}@$(echo "$HOST" | tr -d '\r[:space:]')" "cd ${DIR:-~/space_pioneers_remaster} && bash deploy/deploy.sh" \
            || { code=$?; echo "::error title=Auto-deploy::SSH zakonczony kodem $code - porownaj odcisk klucza z serwerem (docs/DEPLOY.md)"; exit $code; }
